name: Publish multi-arch images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (also used as NEXT_PUBLIC_APP_VERSION)
        required: true
        default: latest
  push:
    branches: [master]
    paths:
      - .github/workflows/docker-build.yml
      - server/Dockerfile
      - server/pom.xml
      - server/src/**
      - web/Dockerfile
      - web/package.json
      - web/pnpm-lock.yaml
      - web/src/**
      - docs/**

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || 'latest' }}
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/novanovastudio-server
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/novanovastudio-web

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server (${{ matrix.platform }})
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file "$GITHUB_WORKSPACE/server/Dockerfile" \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "$SERVER_IMAGE:$TAG-${{ matrix.arch }}" \
            --push "$GITHUB_WORKSPACE/server"

      - name: Build web (${{ matrix.platform }})
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file "$GITHUB_WORKSPACE/web/Dockerfile" \
            --provenance=false --sbom=false \
            --build-arg "NEXT_PUBLIC_SERVER_URL=" \
            --build-arg "NEXT_PUBLIC_APP_VERSION=$TAG" \
            --build-arg "NEXT_PUBLIC_CREDIT_STORE_URL=" \
            --build-arg "NEXT_PUBLIC_ICP_RECORD_NUMBER=" \
            --build-arg "NEXT_PUBLIC_GITHUB_URL=" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "$WEB_IMAGE:$TAG-${{ matrix.arch }}" \
            --push "$GITHUB_WORKSPACE"

  merge:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge amd64 + arm64 into one tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$SERVER_IMAGE:$TAG" \
            "$SERVER_IMAGE:$TAG-amd64" \
            "$SERVER_IMAGE:$TAG-arm64"
          docker buildx imagetools create \
            --tag "$WEB_IMAGE:$TAG" \
            "$WEB_IMAGE:$TAG-amd64" \
            "$WEB_IMAGE:$TAG-arm64"

      - name: Verify both architectures are present
        run: |
          set -euo pipefail
          for image in "$SERVER_IMAGE:$TAG" "$WEB_IMAGE:$TAG"; do
            echo "=== $image ==="
            docker buildx imagetools inspect "$image"
            raw=$(docker buildx imagetools inspect --raw "$image")
            echo "$raw" | grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"amd64"' \
              || { echo "::error::linux/amd64 missing from $image"; exit 1; }
            echo "$raw" | grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"arm64"' \
              || { echo "::error::linux/arm64 missing from $image"; exit 1; }
          done

      - name: Make packages public so servers can pull anonymously
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in novanovastudio-server novanovastudio-web; do
            if gh api --method PATCH -f visibility=public "/user/packages/container/$pkg" >/dev/null 2>&1; then
              echo "$pkg is public"
            else
              echo "::warning::Set $pkg to Public manually (link below), or run docker login ghcr.io on the server"
            fi
          done

      - name: Summary
        run: |
          {
            echo "### Multi-arch images ready"
            echo ""
            echo "- \`$SERVER_IMAGE:$TAG\`"
            echo "- \`$WEB_IMAGE:$TAG\`"
            echo ""
            echo "Both tags contain linux/amd64 + linux/arm64."
            echo ""
            echo "If \`docker pull\` is denied, change package visibility to Public:"
            echo "https://github.com/users/${{ github.repository_owner }}/packages/container/novanovastudio-server/settings"
            echo "https://github.com/users/${{ github.repository_owner }}/packages/container/novanovastudio-web/settings"
          } >> "$GITHUB_STEP_SUMMARY"
